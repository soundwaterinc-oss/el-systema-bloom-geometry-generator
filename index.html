<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Scanning Generator</title>
    <link rel="stylesheet" href="styles.css?v=20260517-7" />
  </head>
  <body>
    <main class="app">
      <section class="panel hero">
        <div>
          <p class="eyebrow">Image Driven Sustained Sound</p>
          <h1>Geometry Scanning Generator</h1>
          <p class="subtle">
            Image scanning shapes sustained harmony, tone, and spatial motion.
          </p>
        </div>
        <div class="hero-actions">
          <button id="audioToggle">Start Audio</button>
          <button id="transportToggle">Start Sequencer</button>
          <button id="autogenesisToggle">Start Autogenesis</button>
          <button id="mutateButton">Pattern Mutation</button>
        </div>
      </section>

      <section class="layout">
        <div class="panel controls">
          <label>
            <span>BPM</span>
            <input id="bpm" type="range" min="90" max="160" value="128" />
            <strong id="bpmValue">128</strong>
          </label>

          <label>
            <span>Rhythm preset</span>
            <select id="rhythmPreset"></select>
          </label>

          <label>
            <span>Scale preset</span>
            <select id="scalePreset"></select>
          </label>

          <label>
            <span>Function preset</span>
            <select id="functionPreset"></select>
          </label>

          <label>
            <span>Scan source</span>
            <select id="visualPreset"></select>
          </label>

          <label>
            <span>Image input</span>
            <input id="imageInput" type="file" accept="image/*" />
          </label>

          <label>
            <span>Scan path</span>
            <select id="scanPathPreset"></select>
          </label>

          <label>
            <span>Cutoff</span>
            <input id="cutoff" type="range" min="180" max="2600" value="900" />
            <strong id="cutoffValue">900</strong>
          </label>

          <label>
            <span>Resonance</span>
            <input
              id="resonance"
              type="range"
              min="1"
              max="24"
              step="0.1"
              value="12"
            />
            <strong id="resonanceValue">12.0</strong>
          </label>

          <label>
            <span>Decay</span>
            <input id="decay" type="range" min="0.08" max="0.6" step="0.01" value="0.24" />
            <strong id="decayValue">0.24</strong>
          </label>

          <label>
            <span>Accent</span>
            <input id="accent" type="range" min="0.2" max="1.6" step="0.01" value="0.8" />
            <strong id="accentValue">0.80</strong>
          </label>

          <label>
            <span>Slide</span>
            <input id="slide" type="range" min="0.02" max="0.3" step="0.01" value="0.12" />
            <strong id="slideValue">0.12</strong>
          </label>

          <div class="layer-controls">
            <label>
              <span>Tone brightness</span>
              <input id="toneBrightness" type="range" min="0.2" max="2.4" step="0.01" value="1.1" />
              <strong id="toneBrightnessValue">1.10</strong>
            </label>
            <label>
              <span>Texture</span>
              <input id="grit" type="range" min="0" max="1.4" step="0.01" value="0.4" />
              <strong id="gritValue">0.40</strong>
            </label>
            <label>
              <span>Air mix</span>
              <input id="noiseMix" type="range" min="0" max="1" step="0.01" value="0.24" />
              <strong id="noiseMixValue">0.24</strong>
            </label>
            <label>
              <span>Edge brightness</span>
              <input id="clickAmount" type="range" min="0" max="1.6" step="0.01" value="0.72" />
              <strong id="clickAmountValue">0.72</strong>
            </label>
          </div>

          <div class="layer-controls">
            <label>
              <span>OSC1 voice</span>
              <select id="bassVoice"></select>
            </label>
            <label>
              <span>Drone voice</span>
              <select id="droneVoice"></select>
            </label>
            <label>
              <span>OSC2 voice</span>
              <select id="percussionVoice"></select>
            </label>
            <label>
              <span>OSC1 level</span>
              <input id="bassLevel" type="range" min="0" max="1.2" step="0.01" value="1.08" />
              <strong id="bassLevelValue">1.08</strong>
            </label>
            <label>
              <span>OSC1 drive</span>
              <input id="osc1Drive" type="range" min="0" max="2.4" step="0.01" value="1.15" />
              <strong id="osc1DriveValue">1.15</strong>
            </label>
            <label>
              <span>OSC1 spread</span>
              <input id="osc1Spread" type="range" min="0" max="40" step="1" value="12" />
              <strong id="osc1SpreadValue">12</strong>
            </label>
            <label>
              <span>OSC1 motion</span>
              <input id="osc1Motion" type="range" min="0" max="1.5" step="0.01" value="0.85" />
              <strong id="osc1MotionValue">0.85</strong>
            </label>
            <label>
              <span>Drone level</span>
              <input id="droneLevel" type="range" min="0" max="1.2" step="0.01" value="0.02" />
              <strong id="droneLevelValue">0.02</strong>
            </label>
            <label>
              <span>Drone drive</span>
              <input id="droneDrive" type="range" min="0" max="2.4" step="0.01" value="0.52" />
              <strong id="droneDriveValue">0.52</strong>
            </label>
            <label>
              <span>Drone spread</span>
              <input id="droneSpread" type="range" min="0" max="40" step="1" value="8" />
              <strong id="droneSpreadValue">8</strong>
            </label>
            <label>
              <span>Drone LFO rate</span>
              <input id="droneLfoRate" type="range" min="0.02" max="2" step="0.01" value="0.18" />
              <strong id="droneLfoRateValue">0.18</strong>
            </label>
            <label>
              <span>Drone LFO depth</span>
              <input id="droneLfoDepth" type="range" min="0" max="1200" step="10" value="420" />
              <strong id="droneLfoDepthValue">420</strong>
            </label>
            <label>
              <span>OSC2 level</span>
              <input id="percussionLevel" type="range" min="0" max="1.2" step="0.01" value="0.56" />
              <strong id="percussionLevelValue">0.56</strong>
            </label>
            <label>
              <span>OSC2 drive</span>
              <input id="osc2Drive" type="range" min="0" max="2.4" step="0.01" value="1.05" />
              <strong id="osc2DriveValue">1.05</strong>
            </label>
            <label>
              <span>OSC2 spread</span>
              <input id="osc2Spread" type="range" min="0" max="40" step="1" value="16" />
              <strong id="osc2SpreadValue">16</strong>
            </label>
            <label>
              <span>OSC2 motion</span>
              <input id="osc2Motion" type="range" min="0" max="1.5" step="0.01" value="1.05" />
              <strong id="osc2MotionValue">1.05</strong>
            </label>
          </div>
        </div>

        <div class="panel visual">
          <canvas id="geometryCanvas" width="640" height="420"></canvas>
          <canvas id="luminanceCanvas" width="640" height="120"></canvas>
          <div class="feature-grid">
            <div>
              <span>Density</span>
              <strong id="densityValue">0.00</strong>
            </div>
            <div>
              <span>Edge Density</span>
              <strong id="edgeDensityValue">0.00</strong>
            </div>
            <div>
              <span>Complexity</span>
              <strong id="complexityValue">0.00</strong>
            </div>
          </div>
          <div id="stepGrid" class="layer-grid" aria-label="16 step sequencer"></div>
        </div>
      </section>
    </main>

    <script src="app.js?v=20260517-7"></script>
  </body>
</html>
